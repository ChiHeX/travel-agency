openapi: 3.1.0
info:
  title: Travel Agency API
  version: 1.0.0
  description: |
    旅行社在线跟团游系统的正式接口契约。PRD 定义业务，本文件定义可执行的 HTTP 契约。
    当前后端脚手架不构成兼容依据；前端 Mock、正式后端和契约测试均以本文件为准。
x-contract-status: FROZEN
servers:
  - url: /api
    description: 当前站点 API
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Home
  - name: Routes
  - name: Content
  - name: Account
  - name: Travelers
  - name: Favorites
  - name: Orders
  - name: Messages
  - name: Consultations
  - name: Admin Dashboard
  - name: Admin Routes
  - name: Admin Departures
  - name: Admin Resources
  - name: Admin Orders
  - name: Admin Accounts
  - name: Admin Content
  - name: Guide

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 服务健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 注册普通用户
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /home:
    get:
      tags: [Home]
      operationId: getHome
      summary: 获取首页聚合数据
      security: []
      responses:
        '200':
          description: 首页真实统计及线路数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeEnvelope' }

  /routes:
    get:
      tags: [Routes]
      operationId: listPublicRoutes
      summary: 搜索和筛选已发布线路
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: departureCity
          in: query
          schema: { type: string, maxLength: 64 }
        - name: destination
          in: query
          schema: { type: string, maxLength: 128 }
        - name: minPrice
          in: query
          schema: { $ref: '#/components/schemas/Money' }
        - name: maxPrice
          in: query
          schema: { $ref: '#/components/schemas/Money' }
        - name: durationDays
          in: query
          schema: { type: integer, minimum: 1 }
        - name: departureMonth
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: hasDeparture
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          description: 允许 minAdultPrice、validBookingCount、ratingAvg
          schema:
            type: string
            enum: ['minAdultPrice,asc', 'minAdultPrice,desc', 'validBookingCount,desc', 'ratingAvg,desc']
      responses:
        '200':
          description: 线路分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /routes/{routeId}:
    parameters:
      - { $ref: '#/components/parameters/RouteId' }
    get:
      tags: [Routes]
      operationId: getPublicRoute
      summary: 获取线路详情、可报名团期、行程和近期评价
      security: []
      responses:
        '200':
          description: 线路详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDetailEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /routes/{routeId}/reviews:
    parameters:
      - { $ref: '#/components/parameters/RouteId' }
    get:
      tags: [Routes]
      operationId: listRouteReviews
      summary: 获取线路的可见评价
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: 评价分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attractions:
    get:
      tags: [Content]
      operationId: listPublicAttractions
      summary: 查询公开景点资料
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: city
          in: query
          schema: { type: string, maxLength: 64 }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 景点分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttractionPageEnvelope' }

  /articles:
    get:
      tags: [Content]
      operationId: listPublicArticles
      summary: 查询已发布旅游攻略
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: destination
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 攻略分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticlePageEnvelope' }

  /articles/{articleId}:
    parameters:
      - { $ref: '#/components/parameters/ArticleId' }
    get:
      tags: [Content]
      operationId: getPublicArticle
      summary: 获取已发布攻略详情
      security: []
      responses:
        '200':
          description: 攻略详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /account/profile:
    get:
      tags: [Account]
      operationId: getProfile
      summary: 获取个人资料
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Account]
      operationId: updateProfile
      summary: 修改个人资料
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: 修改后的资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /account/password:
    put:
      tags: [Account]
      operationId: changePassword
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { description: 密码修改成功 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /travelers:
    get:
      tags: [Travelers]
      operationId: listTravelers
      summary: 获取当前用户的常用出行人
      responses:
        '200':
          description: 常用出行人列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelerListEnvelope' }
    post:
      tags: [Travelers]
      operationId: createTraveler
      summary: 新增常用出行人
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TravelerRequest' }
      responses:
        '201':
          description: 创建成功
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelerEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /travelers/{travelerId}:
    parameters:
      - { $ref: '#/components/parameters/TravelerId' }
    put:
      tags: [Travelers]
      operationId: updateTraveler
      summary: 修改自己的常用出行人
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TravelerUpdateRequest' }
      responses:
        '200':
          description: 修改后的出行人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelerEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Travelers]
      operationId: deleteTraveler
      summary: 删除自己的常用出行人
      responses:
        '204': { description: 删除成功 }
        '404': { $ref: '#/components/responses/NotFound' }

  /favorites:
    get:
      tags: [Favorites]
      operationId: listFavorites
      summary: 获取收藏线路
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: 收藏线路分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePageEnvelope' }
    post:
      tags: [Favorites]
      operationId: addFavorite
      summary: 收藏线路
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteCreateRequest' }
      responses:
        '201':
          description: 收藏成功
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavoriteEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /favorites/{routeId}:
    parameters:
      - { $ref: '#/components/parameters/RouteId' }
    delete:
      tags: [Favorites]
      operationId: removeFavorite
      summary: 取消收藏线路
      responses:
        '204': { description: 已取消收藏 }

  /orders:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: 分页查询当前用户订单
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: 订单分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPageEnvelope' }
    post:
      tags: [Orders]
      operationId: createOrder
      summary: 创建待支付订单并占用团期名额
      description: 服务端重新校验价格、团期状态和容量，并保存价格及出行人快照。
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '201':
          description: 订单创建成功
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{orderNo}:
    parameters:
      - { $ref: '#/components/parameters/OrderNo' }
    get:
      tags: [Orders]
      operationId: getMyOrder
      summary: 获取当前用户订单详情
      responses:
        '200':
          description: 包含下单快照、支付、退款和评价状态的订单详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetailEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{orderNo}/pay:
    parameters:
      - { $ref: '#/components/parameters/OrderNo' }
    post:
      tags: [Orders]
      operationId: startOrderPayment
      summary: 发起支付宝沙箱支付
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: 支付跳转信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStartEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{orderNo}/cancel:
    parameters:
      - { $ref: '#/components/parameters/OrderNo' }
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: 取消待支付订单并释放名额
      responses:
        '200':
          description: 取消后的订单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{orderNo}/refunds:
    parameters:
      - { $ref: '#/components/parameters/OrderNo' }
    post:
      tags: [Orders]
      operationId: createRefund
      summary: 为已支付订单申请退款
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundCreateRequest' }
      responses:
        '201':
          description: 退款申请已创建
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /orders/{orderNo}/reviews:
    parameters:
      - { $ref: '#/components/parameters/OrderNo' }
    post:
      tags: [Orders]
      operationId: createReview
      summary: 评价已完成订单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreateRequest' }
      responses:
        '201':
          description: 评价创建成功
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /payments/alipay/notify:
    post:
      tags: [Orders]
      operationId: handleAlipayNotification
      summary: 支付宝异步通知
      description: 必须使用支付宝官方 SDK 验签、核对订单号与金额，并按交易号幂等处理。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        '200':
          description: 支付宝要求的确认文本
          content:
            text/plain:
              schema: { type: string, enum: [success, failure] }

  /messages:
    get:
      tags: [Messages]
      operationId: listMessages
      summary: 分页查询当前用户站内消息
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 消息分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePageEnvelope' }

  /messages/unread-count:
    get:
      tags: [Messages]
      operationId: getUnreadMessageCount
      summary: 获取当前用户未读消息数
      responses:
        '200':
          description: 未读数量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountEnvelope' }

  /messages/{messageId}/read:
    parameters:
      - { $ref: '#/components/parameters/MessageId' }
    patch:
      tags: [Messages]
      operationId: markMessageRead
      summary: 将自己的消息标记为已读
      responses:
        '200':
          description: 更新后的消息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/read-all:
    post:
      tags: [Messages]
      operationId: markAllMessagesRead
      summary: 将当前用户全部消息标记为已读
      responses:
        '204': { description: 操作成功 }

  /consultations:
    get:
      tags: [Consultations]
      operationId: listMyConsultations
      summary: 分页查询当前用户咨询
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: 咨询分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationPageEnvelope' }
    post:
      tags: [Consultations]
      operationId: createConsultation
      summary: 提交在线咨询
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsultationCreateRequest' }
      responses:
        '201':
          description: 咨询创建成功
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /consultations/{consultationId}:
    parameters:
      - { $ref: '#/components/parameters/ConsultationId' }
    get:
      tags: [Consultations]
      operationId: getMyConsultation
      summary: 获取自己的咨询及回复
      responses:
        '200':
          description: 咨询详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /consultations/{consultationId}/close:
    parameters:
      - { $ref: '#/components/parameters/ConsultationId' }
    post:
      tags: [Consultations]
      operationId: closeMyConsultation
      summary: 关闭自己的咨询
      responses:
        '200':
          description: 关闭后的咨询
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/dashboard:
    get:
      tags: [Admin Dashboard]
      operationId: getAdminDashboard
      summary: 获取后台真实业务统计
      security: [{ bearerAuth: [] }]
      x-roles: [STAFF, ADMIN]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30], default: 7 }
      responses:
        '200':
          description: 统计指标和趋势
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/routes:
    get:
      tags: [Admin Routes]
      operationId: listAdminRoutes
      summary: 分页查询全部线路
      x-roles: [STAFF, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RouteStatus' }
      responses:
        '200':
          description: 线路分页结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Routes]
      operationId: createRoute
      summary: 创建线路草稿
      x-roles: [STAFF, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteUpsertRequest' }
      responses:
        '201':
          description: 线路创建成功
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/routes/{routeId}:
    parameters:
      - { $ref: '#/components/parameters/RouteId' }
    get:
      tags: [Admin Routes]
      operationId: getAdminRoute
      summary: 获取线路管理详情
      x-roles: [STAFF, ADMIN]
      responses:
        '200':
          description: 线路详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDetailEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin Routes]
      operationId: updateRoute
      summary: 修改线路基本资料
      x-roles: [STAFF, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteUpsertRequest' }
      responses:
        '200':
          description: 修改后的线路
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/routes/{routeId}/status:
    parameters:
      - { $ref: '#/components/parameters/RouteId' }
    patch:
      tags: [Admin Routes]
      operationId: updateRouteStatus
      summary: 上架或下架线路
      x-roles: [STAFF, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteStatusUpdateRequest' }
      responses:
        '200':
          description: 更新后的线路
          content:
            application/json:
