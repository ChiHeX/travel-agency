# 纯 HTTP 配置（本地无证书演示；也是首次申请证书时使用的那一份）。
#
# /.well-known/acme-challenge/ 必须显式配置：否则请求会落到下面的 SPA 回退，
# 返回 index.html 而不是 ACME 令牌，certbot 的 --webroot 校验必然失败。
# 目录由 compose 挂载（宿主机 deploy/certbot-webroot → 容器 /var/www/certbot，只读），
# certbot 在宿主机写入，nginx 只负责把文件原样吐出去。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 证书签发/续期用的 ACME 挑战目录，优先于 SPA 回退匹配。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
