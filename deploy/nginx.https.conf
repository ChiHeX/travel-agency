# Travel Agency HTTPS 边缘配置（Nginx）
#
# 用于演示/生产部署：80 端口只做 ACME 挑战放行 + 跳转 HTTPS，业务全部走 443。
# 默认的 deploy/nginx.conf 是纯 HTTP，供本地无证书场景使用，也配了同样的 ACME 挑战目录
# —— 首次申请证书要用它（HTTPS 配置在没有证书时无法启动，见 docs/DEPLOYMENT.md §4.1）。
# 启用 HTTPS 时用本文件覆盖容器内的 /etc/nginx/conf.d/default.conf
# （见 deploy/docker-compose.https.yml）。
#
# 证书请挂载到 /etc/nginx/certs/（fullchain.pem + privkey.pem），不要把证书、私钥提交到仓库
# （CONTRIBUTING §14）。域名用 server_name 限定；证书需覆盖该域名。

server {
    listen 80;
    server_name _;

    # 证书签发/续期用的 ACME 挑战目录，不跳转，保持明文可达。
    # ^~ 保证它优先于下面的跳转规则匹配。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 5m;
    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 反向代理。X-Forwarded-Proto 让后端/支付宝回调识别真实协议。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 前端路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
