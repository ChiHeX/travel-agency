spring:
  application:
    name: travel-agency-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel_agency?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD:travel_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 30000
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # 必填：JWT 签名密钥。不提供默认值，缺失或过短时应用启动即失败（fail-fast），
    # 避免退回到源码里公开可见的默认值（见 CONTRIBUTING §14：禁止提交 JWT Secret）。
    # 本地开发请通过环境变量 JWT_SECRET 注入，例如至少 32 字节的随机字符串。
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  integrations:
    amap:
      enabled: ${AMAP_ENABLED:false}
      web-key: ${AMAP_WEB_KEY:}
    alipay:
      sandbox: ${ALIPAY_SANDBOX:true}
      enabled: ${ALIPAY_ENABLED:false}
      # 网关地址：默认指向沙箱新版网关（与支付宝开放平台沙箱页面一致）。
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      # 沙箱应用 APPID。未配置时支付链路按“适配点未接入”处理，不生成真实收银台链接。
      app-id: ${ALIPAY_APP_ID:}
      # 应用私钥（RSA2 / PKCS#8，不含头部 PEM 标记）。严禁提交到仓库（见 CONTRIBUTING §14）。
      app-private-key: ${ALIPAY_APP_PRIVATE_KEY:}
      # 支付宝公钥（用于验签支付宝的异步通知与响应报文）。
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      # 旧的回调共享密钥，仅在未配置支付宝公钥时作为本地开发回退使用（HMAC 适配点）。
      # 配置了支付宝公钥后，回调一律走官方 RSA2 验签，本项不再参与。
      callback-secret: ${ALIPAY_CALLBACK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.travelagency: INFO
