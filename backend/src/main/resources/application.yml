spring:
  application:
    name: travel-agency-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel_agency?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:travel}
    password: ${DB_PASSWORD:travel_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 30000
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # 必填：JWT 签名密钥。不提供默认值，缺失或过短时应用启动即失败（fail-fast），
    # 避免退回到源码里公开可见的默认值（见 CONTRIBUTING §14：禁止提交 JWT Secret）。
    # 本地开发请通过环境变量 JWT_SECRET 注入，例如至少 32 字节的随机字符串。
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  integrations:
    amap:
      enabled: ${AMAP_ENABLED:false}
      web-key: ${AMAP_WEB_KEY:}
    alipay:
      sandbox: ${ALIPAY_SANDBOX:true}
      enabled: ${ALIPAY_ENABLED:false}
      # 必填：回调共享密钥。未配置时支付回调一律被拒绝（fail-closed），
      # 避免退回到源码里公开可见的默认值（见 CONTRIBUTING §14：禁止提交密钥）。
      callback-secret: ${ALIPAY_CALLBACK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.travelagency: INFO
